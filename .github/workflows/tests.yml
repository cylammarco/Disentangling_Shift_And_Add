name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - python: "3.10"
            numpy: "numpy==1.26.4"
          - python: "3.11"
            numpy: "numpy==2.0.2"
          - python: "3.12"
            numpy: "numpy>=2,<3"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "${{ matrix.numpy }}"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: python -m build

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[docs]"
      - run: python docs/generate_figures.py
      - run: sphinx-build -b html -n -W --keep-going docs docs/_build/html
